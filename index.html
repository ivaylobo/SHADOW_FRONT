<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Shadow Front Prototype</title>
  </head>
  <body>
    <section id="mission-map-screen" aria-label="Campaign map">
      <main class="mission-map__stage" aria-label="Ukraine and Russia mission map">
        <img
          class="campaign-map"
          src="/assets/Maps/campaign-ukraine-russia.svg"
          aria-label="Map of Ukraine and Russia"
        />
        <div id="mission-marker-layer" class="mission-marker-layer"></div>
      </main>

      <aside class="mission-map__briefing" aria-label="Mission briefing">
        <p class="label">Campaign</p>
        <h1>Shadow Front</h1>
        <p id="mission-progress" class="mission-progress"></p>
        <ul id="mission-list" class="mission-list"></ul>
      </aside>
    </section>

    <div id="app" hidden>
      <main id="game-shell" aria-label="Game area">
        <canvas id="game-canvas"></canvas>
      </main>
      <aside id="side-panel" aria-label="Interface">
        <section class="panel-section status-section">
          <p class="label">Selected Hero</p>
          <h1 id="selected-name">-</h1>
          <dl class="status-grid">
            <div>
              <dt>Stance</dt>
              <dd id="selected-stance">-</dd>
            </div>
            <div>
              <dt>Motion</dt>
              <dd id="selected-motion">-</dd>
            </div>
            <div>
              <dt>Health</dt>
              <dd id="selected-health">-</dd>
            </div>
            <div>
              <dt>Target</dt>
              <dd id="selected-target">-</dd>
            </div>
          </dl>
        </section>

        <details class="panel-section controls-section">
          <summary>Controls</summary>
          <ul id="controls-list" class="controls-list"></ul>
        </details>

        <details class="panel-section description-section">
          <summary>Description</summary>
          <div id="level-description" class="level-description">
            <h2 id="description-title"></h2>
            <div id="description-body"></div>
          </div>
        </details>

        <section id="debug-panel" class="panel-section debug-section" hidden>
          <p class="label">Debug</p>
          <pre id="debug-readout"></pre>
        </section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
